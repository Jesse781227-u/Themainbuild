# Relay API on Cloudflare Workers.
# Secrets are never in this file. Set them per environment with
#   npx wrangler secret put <NAME> --env <staging|production>
# FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY, TOKEN_ENCRYPTION_KEY,
# META_APP_SECRET, META_VERIFY_TOKEN, ADMIN_BOT_PHONE_NUMBER_ID, ADMIN_BOT_ACCESS_TOKEN,
# BACHS_API_KEY, BACHS_WEBHOOK_SECRET.
# Local development reads them from api/.dev.vars (git-ignored; copy .dev.vars.example).
#
# Bindings are not inherited by named environments, so each one repeats them.

name = "relay-api"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Privacy, Terms and Data Deletion pages (and the logo). /privacy serves privacy.html.
[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[observability]
enabled = true

# ── development (wrangler dev) ────────────────────────────────────────────────
[vars]
RELAY_ENV = "development"
API_BASE_URL = "http://localhost:8787"
FIREBASE_PROJECT_ID = "demo-relay"
FIRESTORE_EMULATOR_HOST = "127.0.0.1:8080"

[triggers]
# Every minute: release expired stock holds and re-queue stuck events. 06:00 UTC = the 7am Lagos
# morning brief; 19:00 UTC = the 20:00 Lagos summary.
crons = ["* * * * *", "0 6 * * *", "0 19 * * *"]

[[queues.producers]]
queue = "relay-events-dev"
binding = "EVENTS"

[[queues.consumers]]
queue = "relay-events-dev"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "relay-events-dev-dlq"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "relay-product-images-dev"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# ── staging ───────────────────────────────────────────────────────────────────
[env.staging]
name = "relay-api-staging"
vars = { RELAY_ENV = "staging", API_BASE_URL = "https://relay-api-staging.0xjave.workers.dev" }
triggers = { crons = ["* * * * *", "0 6 * * *", "0 19 * * *"] }

[[env.staging.queues.producers]]
queue = "relay-events-staging"
binding = "EVENTS"

[[env.staging.queues.consumers]]
queue = "relay-events-staging"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "relay-events-staging-dlq"

[[env.staging.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "relay-product-images-staging"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# ── production ────────────────────────────────────────────────────────────────
[env.production]
name = "relay-api-production"
# TODO(jesse): the production hostname (custom domain or workers.dev) once the Cloudflare account exists.
vars = { RELAY_ENV = "production", API_BASE_URL = "https://relay-api-production.example.workers.dev", PAYMENTS_MODE = "transfer" }
triggers = { crons = ["* * * * *", "0 6 * * *", "0 19 * * *"] }

[[env.production.queues.producers]]
queue = "relay-events-production"
binding = "EVENTS"

[[env.production.queues.consumers]]
queue = "relay-events-production"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "relay-events-production-dlq"

[[env.production.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "relay-product-images-production"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 60 }
