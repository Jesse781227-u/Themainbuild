# Relay's public website (site/): a static site on Render's CDN.
# New → Blueprint → pick this repository, or open:
#   https://dashboard.render.com/blueprint/new?repo=https://github.com/Jesse781227-u/Themainbuild
services:
  - type: web
    name: relay-site
    runtime: static
    branch: pivot/whatsapp-native
    rootDir: site
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - site/**
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /data-deletion
        destination: /data-deletion.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
